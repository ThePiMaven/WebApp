<!DOCTYPE html>
<html>
<head>
    <style>
        label{
            font-size: 120px;
        }
        button{
            font-size: 120px;
        }
        input[type="checkbox"]{
            height: 60px;
            width: 60px;
        }
        input[type="text"]{
            height: 100px;
            width: 400px;
            font-size: 100px;
        }
    </style>
</head>
<body>
    <label>
        <div>
            <input type="text" id="userText">
        </div>
        <div id="area">
            <div>
                <button onclick="edit()" id="button1">
                Edit
                </button>
                <input type="checkbox" id="box1">
                <label id="label1">task 1</label>
            </div>
            <div>
                <button id="button2">
                Edit
                </button>
                <input type="checkbox" id="box2">
                <label id="label1">task 2</label>
            </div>
        </div>
        <button onclick="newBox()">
            New Box
        </button>
    </label>
    <script>
        //Edit
        function edit() {
            document.getElementById("label1").innerText = document.getElementById("userText").value;
        }
        //New Box
        
        function newBox() {
            let div1 = document.createElement("div");
            div1.id = "div1";
            document.getElementById("area").appendChild(div1);
            let button1 = document.createElement("button");
            button1.innerText = "Edit";
            let box1 = document.createElement("input");
            box1.type = "checkbox";
            let label1 = document.createElement("label"):
            label1.textContent = "task 3";
            document.getElementById("div1").appendChild(button1);
            document.getElementById("div1").appendChild(box1);
            document.getElementById("div1").appendChild(label1);
        }
    </script>
</body>
</html>
