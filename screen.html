<!DOCTYPE html>
<html>
<head>
    <title>Benefits</title>
    <link rel="apple-touch-icon" href="Pi.jpg">
    <style>
        body{
            background-color: black;
            color: white;
        }
        label{
            font-size: 120px;
        }
        button{
            font-size: 120px;
            padding: 1px 1px 1px 1px;
        }
        input[type="checkbox"]{
            height: 80px;
            width: 80px;
        }
        input[type="text"]{
            height: 100px;
            width: 400px;
            font-size: 100px;
        }
    </style>
</head>
<body>
    <label>
        <div>
            <input type="text" id="userText">
        </div>
        <div id="area">
            <!--
            <div>
                <button onclick="edit()" id="button1">
                Edit
                </button>
                <input type="checkbox" id="box1">
                <label id="label1">task 1</label>
            </div>
            <div>
                <button id="button2">
                Edit
                </button>
                <input type="checkbox" id="box2">
                <label id="label1">task 2</label>
            </div>
            -->
        </div>
        <button onclick="newBox()">
            New Box
        </button>
    </label>
    <script>
        //Retrieval
        let task = JSON.parse(localStorage.getItem("task"));
        if (task !== null){
            newBox(task);
        }
        //Edit
        function edit() {
            document.getElementById("label1").innerText = document.getElementById("userText").value;
            localStorage.setItem("task",JSON.stringify(document.getElementById("userText").value))
        }
        //New Box
        function newBox(text = "task") {
            let div = document.createElement("div");
            div.id = "div1";
            document.getElementById("area").appendChild(div);
            let button = document.createElement("button");
            button.innerText = "Edit";
            button.onclick = edit;
            let box = document.createElement("input");
            box.type = "checkbox";
            box.style.marginLeft = "30px";
            let label = document.createElement("label");
            label.innerText = text;
            label.id = "label1";
            label.style.marginLeft = "30px";
            document.getElementById("div1").appendChild(button);
            document.getElementById("div1").appendChild(box);
            document.getElementById("div1").appendChild(label);
        }
        //Saving

    </script>
</body>
</html>
