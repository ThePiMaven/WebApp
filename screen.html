<!DOCTYPE html>
<html>
<head>
    <style>
        label{
            font-size: 120px;
        }
        button{
            font-size: 120px;
        }
        input[type="checkbox"]{
            height: 60px;
            width: 60px;
        }
        input[type="text"]{
            height: 100px;
            width: 400px;
            font-size: 100px;
        }
    </style>
</head>
<body>
    <label>
        <div>
            <input type="text" id="userText">
        </div>
        <div id="area">
            <div>
                <button onclick="edit()" id="button1">
                Edit
                </button>
                <input type="checkbox" id="box1">
                <label id="label1">task 1</label>
            </div>
            <div>
                <button id="button2">
                Edit
                </button>
                <input type="checkbox" id="box2">
                <label id="label1">task 2</label>
            </div>
        </div>
        <button onclick="newBox()">
            New Box
        </button>
    </label>
    <script>
        //Edit
        function edit() {
            document.getElementById("label1").innerText = document.getElementById("userText").value;
        }
        //New Box
        
        function newBox() {
            let box = document.createElement("button");
            box.innerText = "new";
            document.getElementById("area").appendChild(box);
        }
    </script>
</body>
</html>
