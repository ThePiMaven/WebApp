<!DOCTYPE html>
<html>
<head>
    <style>
        label{
            font-size: 120px;
        }
        button{
            font-size: 120px;
        }
        input[type="checkbox"]{
            height: 60px;
            width: 60px;
        }
    </style>
</head>
<body>
    <label>
        <div>
            <input type="text" id="userText">
        </div>
        <div>
            <button onclick="edit()" id="button1">
                Edit
            </button>
            <input type="checkbox" id="box1">
            task 1
        </div>
        <div>
            <button id="button2">
                Edit
            </button>
            <input type="checkbox" id="box2">
            task 2
        </div>
    </label>
    <script>
        function edit() {
            let text = document.getElementById("userText").value;
            alert(text);
        }
    </script>
</body>
</html>
