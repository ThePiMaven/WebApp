<!DOCTYPE html>
<html>
<head>
    <title>Benefits</title>
<!--<link rel="apple-touch-icon" href="Pi.jpg">
    -->    
    <style>
        body{
            background-color: black;
            color: white;
            background-image: url("Images/Parchment.jpg");
            background-size: cover;
            background-position: center -550px;
        }
        label{
            font-size: 120px;
        }
        button{
            font-size: 120px;
            padding: 1px 1px 1px 1px;
            line-height: 1;
            border: 1px solid;
            color: black;
        }
        input[type="checkbox"]{
            height: 80px;
            width: 80px;
        }
        input[type="text"]{
            display: block;
            margin: 0 auto;
            height: 100px;
            width: 400px;
            font-size: 100px;
            margin-bottom: 50px;
        }
        #new{
            position:fixed;
            bottom:200px;
        }
    </style>
</head>
<body>
    <label>
        <div>
            <input type="text" id="userText">
        </div>
        <div id="area">
            <!--
            <div>
                <button onclick="edit()" id="button1">
                Edit
                </button>
                <input type="checkbox" id="box1">
                <label id="label1">task 1</label>
            </div>
            <div>
                <button id="button2">
                Edit
                </button>
                <input type="checkbox" id="box2">
                <label id="label1">task 2</label>
            </div>
            -->
        </div>
        <button onclick="newBox()" id="new">
            New
        </button>
    </label>
    <script>
        //Initialize Variables
        const CheckList = [];
        //Retrieval
        let task = JSON.parse(localStorage.getItem("task"));
        if (task !== null){
            newBox(task);
        }
        //Edit
        function edit(num) {
            document.getElementById(`label${num}`).innerText = document.getElementById("userText").value;
            localStorage.setItem("task",JSON.stringify(document.getElementById("userText").value))
        }
        //New Box
        function newBox(text = "task") {
            CheckList.push(text);
            let div = document.createElement("div");
            div.id = `div${CheckList.length}`;
            document.getElementById("area").append(div);
            let button = document.createElement("button");
            button.innerText = "Edit";
            //button.onclick = edit(CheckList.length);
            let box = document.createElement("input");
            box.type = "checkbox";
            box.style.marginLeft = "30px";
            let label = document.createElement("label");
            label.innerText = text;
            label.id = `label${CheckList.length}`;
            label.style.marginLeft = "30px";
            document.getElementById(`div${CheckList.length}`).appendChild(button);
            document.getElementById(`div${CheckList.length}`).appendChild(box);
            document.getElementById(`div${CheckList.length}`).appendChild(label);
            //div.append(button,box,label);
        }
        //Saving

    </script>
</body>
</html>
