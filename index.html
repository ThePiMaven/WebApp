<!DOCTYPE html>
<html>
<head>
    <title>Benefits</title>
<!--<link rel="apple-touch-icon" href="Pi.jpg">
    -->    
    <style>
        body::before {
            content: "";
            position:fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("Images/Parchment.jpg");
            background-size: contain;
            background-position: center -550px;
            z-index: 10;
        }
        body{
            touch-action: manipulation;
        }
        label{
            font-size: 120px;
        }
        button{
            font-size: 120px;
            padding: 1px 1px 1px 1px;
            line-height: 1;
            border: 1px solid;
            color: black;
        }
        input[type="checkbox"]{
            height: 80px;
            width: 80px;
        }
        input[type="text"]{
            display: block;
            height: 100px;
            width: 400px;
            font-size: 100px;
        }
        #change{
            position:fixed !important;
            bottom:200px !important;
            z-index: 100;
            display: flex;
            gap: 20px;
        }
        #area{
            z-index: 12;
            position: relative;
            top: 180px;
        }
        #tasks{
            z-index: 1;
        }
        #pump{
            z-index: 2;
        }
        #pill{
            z-index: 3;
        }
        /*
            #debugConsole {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0,0,0,0.85);
            color: lime;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            box-sizing: border-box;
            z-index: 9999;
        }
        */
        
    </style>
</head>
<body>
    <label>
        <div id="change">
            <button id="new">
                New
            </button>
            <input type="text" id="entry">
        </div>
        <div id="area"> 
        </div>
        <div id="tasks"> 
        </div>
        <div id="pump"> 
        </div>
        <div id="pill"> 
        </div>
    </label>
    <script>
        //localStorage.clear
        //New Button Button
        document.getElementById("new").onclick = () => newBox(document.getElementById("entry").value);
        //Initialize Variables
        const CheckList = [];
        //Retrieval
        let newList = JSON.parse(localStorage.getItem("taskList"));
        for (let item of newList){
            newBox(item);
        }
        //Edit
        function edit(num) {
            document.getElementById(`label${num+1}`).innerText = document.getElementById("entry").value;
            CheckList[num]= document.getElementById("entry").value;
            localStorage.setItem("taskList",JSON.stringify(CheckList));
        }
        //Unique Check
        function Unique(text){
            unique = false;
            counter = 1;
            adder=0;
            while (!unique){
                unique = true;
                counter++;
                for (let item of CheckList){
                    if (item==text){
                        unique=false;
                        adder++;
                        break;
                    }
                }
                if (unique==false){
                    if (adder==1){
                        temp = `${adder}`;
                        text+= temp;
                    }
                    else{
                        text = text.slice(0,-1);
                        temp = `${adder}`;
                        text+= temp;
                    }
                }
                if (counter>10){
                    break;
                }
            }
            return text;
        }
        //New Box
        function newBox(text = "task") {
            //unique entry names
            text = Unique(text);
            // Actually making everything
            CheckList.push(text);
            let div = document.createElement("div");
            div.id = `div${CheckList.length}`;
            document.getElementById("area").append(div);
            let button = document.createElement("button");
            button.innerText = "Edit";
            button.onclick = () => edit(CheckList.indexOf(text));
            let box = document.createElement("input");
            box.type = "checkbox";
            box.style.marginLeft = "30px";
            let label = document.createElement("label");
            label.innerText = text;
            label.id = `label${CheckList.length}`;
            label.style.marginLeft = "30px";
            div.append(button,box,label);
        }
        //Saving

    </script>
</body>
</html>
