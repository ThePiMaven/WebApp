<!DOCTYPE html>
<html>
<head>
    <title>Benefits</title>
<!--<link rel="apple-touch-icon" href="Pi.jpg">
    -->    
    <style>
        body::before {
            content: "";
            position:fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("Images/Parchment.jpg");
            background-size: contain;
            background-position: center -550px;
            z-index: 10;
        }
        body{
            touch-action: manipulation;
        }
        label{
            font-size: 120px;
        }
        button{
            font-size: 120px;
            padding: 1px 1px 1px 1px;
            line-height: 1;
            border: 1px solid;
            color: black;
        }
        input[type="checkbox"]{
            height: 80px;
            width: 80px;
        }
        input[type="text"]{
            display: block;
            height: 100px;
            width: 400px;
            font-size: 100px;
        }
        #change{
            position:fixed !important;
            bottom:200px !important;
            z-index: 100;
            display: flex;
            gap: 20px;
        }
        #tabs{
            position:relative;
            top:20px;
            z-index: 101;
            display: flex;
        }
        #tabButton0{
            position: relative;
            top: 0px;
        }
        #tabButton1{
            position: relative;
            top: 0px;
        }
        #tabButton2{
            position: relative;
            top: 0px;
        }
        #tab0, #tab1, #tab2{
            z-index: 1;
            position: absolute;
            top: 180px;
            display: flex;
        }
        .child{
            position: relative;
        }
    </style>
</head>
<body>
    <label>
        <div id="tabs">
            <button id="tabButton0">&#x270D;</button>
            <button id="tabButton1">&#x1F3C3;</button>
            <button id="tabButton2">&#x1F95B;</button>
        </div>
        <div id="change">
            <button id="new">
                New
            </button>
            <input type="text" id="entry">
        </div>
        <div id="tab0"> 
        </div>
        <div id="tab1"> 
        </div>
        <div id="tab2"> 
        </div>
    </label>
    <script>
        localStorage.clear;
        //New Button Button
        document.getElementById("new").onclick = () => newBox(document.getElementById("entry").value);
        //Tab Buttons
        document.getElementById("tabButton0").onclick = () => switchTab(0);
        document.getElementById("tabButton1").onclick = () => switchTab(1);
        document.getElementById("tabButton2").onclick = () => switchTab(2);
        //Initialize Variables
        const CheckList = [];
        let BigList = [];
        BigList[0] = [];
        BigList[1] = [];
        BigList[2] = [];
        let currentTab = 0;
        //Retrieval
        //let newList = JSON.parse(localStorage.getItem("taskList"));
        //for (let item of newList){
        //    newBox(item);
        //}
        //Switch Tabs
        function switchTab(num) {
            document.getElementById(`tab${currentTab}`).style.zIndex = 1;
            document.getElementById(`tabButton${currentTab}`).style.top = "0px";
            document.getElementById(`tab${num}`).style.zIndex = 15;
            document.getElementById(`tabButton${num}`).style.top = "30px";
            currentTab = num;
        }
        //Edit
        function edit(num) {
            document.getElementById(`label${num+1}`).innerText = document.getElementById("entry").value;
            CheckList[num]= document.getElementById("entry").value;
            localStorage.setItem("taskList",JSON.stringify(CheckList));
        }
        //Unique Check
        function Unique(text){
            unique = false;
            counter = 1;
            adder=0;
            while (!unique){
                unique = true;
                counter++;
                for (let item of BigList[currentTab]){
                    if (item==text){
                        unique=false;
                        adder++;
                        break;
                    }
                }
                if (unique==false){
                    if (adder==1){
                        temp = `${adder}`;
                        text+= temp;
                    }
                    else{
                        text = text.slice(0,-1);
                        temp = `${adder}`;
                        text+= temp;
                    }
                }
                if (counter>10){
                    break;
                }
            }
            return text;
        }
        //New Box
        function newBox(text = "task") {
            //unique entry names
            text = Unique(text);
            // Actually making everything
            BigList[currentTab].push(text);
            //CheckList.push(text);
            let div = document.createElement("div");
            div.id = `${currentTab}div${BigList[currentTab].length}`;
            div.className = "child";
            document.getElementById(`tab${currentTab}`).append(div);
            let button = document.createElement("button");
            button.innerText = "Edit";
            button.onclick = () => edit(BigList[currentTab].indexOf(text));
            let box = document.createElement("input");
            box.type = "checkbox";
            box.style.marginLeft = "30px";
            let label = document.createElement("label");
            label.innerText = text;
            label.id = `${currentTab}label${BigList[currentTab].length}`;
            label.style.marginLeft = "30px";
            div.append(button,box,label);
        }
        //Saving

    </script>
</body>
</html>
